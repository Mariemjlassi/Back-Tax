name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Recuperer le code
      uses: actions/checkout@v4

    - name: 2. Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: 3. Lancer les tests (CI)
      # C'est ici que GitHub va executer ton ProprietaireServiceTest
      run: ./mvnw clean test

    - name: 4. Message final
      if: success()
      run: echo "Le code de Mariem est valide et prêt pour le déploiement !"
      
      # ... étapes précédentes ...

